services:
  - type: web
    name: secondlook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3-flash-preview

      - key: SEARCH_PROVIDER
        value: serper

      - key: SERPER_API_KEY
        sync: false

      - key: CACHE_TTL_SECONDS
        value: "86400"

      - key: CACHE_MAX_ITEMS
        value: "2000"
