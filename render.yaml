services:
  - type: web
    name: secondlook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      # 선택: 엔드포인트 보호
      # - key: THE_SHORT_CLIENT_KEY
      #   sync: false
